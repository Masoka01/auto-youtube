name: Process & Upload Video

# Triggered by the Next.js API route via repository_dispatch
on:
  repository_dispatch:
    types: [process-video]

  # Allow manual trigger from the GitHub UI for debugging
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Supabase video_jobs UUID to process'
        required: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # ── 1. Check out the repo (worker script lives here) ─────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ─────────────────────────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # ── 3. Install FFmpeg ─────────────────────────────────────────────────────
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      # ── 4. Install npm dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 5. Run the worker ─────────────────────────────────────────────────────
      - name: Process video
        env:
          # Supabase
          NEXT_PUBLIC_SUPABASE_URL:  ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # OpenAI
          OPENAI_API_KEY:            ${{ secrets.OPENAI_API_KEY }}
          # YouTube OAuth2
          YOUTUBE_CLIENT_ID:         ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET:     ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN:     ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          # Job to process (from dispatch payload or manual input)
          JOB_ID: ${{ github.event.client_payload.job_id || inputs.job_id }}
        run: node worker/process-video.mjs

      # ── 6. Upload FFmpeg logs on failure (optional debug artifact) ───────────
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-logs-${{ github.run_id }}
          path: /tmp/ffmpeg-*.log
          retention-days: 3
